Database (H2, in-memory for development) =====
spring.datasource.url=jdbc:h2:mem:aimmaster;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update = auto-create/update tables from our @Entity classes. Fine for dev; a real
# production setup would use versioned migration scripts (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Lets you open http://localhost:8080/h2-console in a browser and inspect the DB visually.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
# DEV ONLY - this secret is committed to the repo so the project runs out of the box.
# Before deploying anywhere real, move this to an environment variable
# (e.g. AIMMASTER_JWT_SECRET) and never commit the real value.
aimmaster.jwt.secret=dev-only-change-me-aimmaster-super-secret-signing-key-32bytes-min
aimmaster.jwt.expiration-ms=86400000

#  Sprint 3: WebSocket / STOMP 
# (no extra properties needed yet - endpoint + topic prefixes are set in WebSocketConfig)

# Admin dashboard 
# Comma-separated usernames allowed to call /api/admin/** (see service.AdminAuthorizer).
# Register a player with this exact username, then that account can view admin.html.
# Add more usernames separated by commas if you want several admin accounts.
aimmaster.admin.usernames=admin

server.port=8080
server.address=0.0.0.0
