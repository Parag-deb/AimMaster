<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimMaster WebSocket Test Client</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/dist/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 0 10px; }
        .panel { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .panel h3 { margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { padding: 8px; width: 100%; max-width: 400px; box-sizing: border-box; }
        button { padding: 10px 20px; margin: 10px 5px 0 0; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #0056b3; }
        #log { background: #1e1e1e; color: #d4d4d4; padding: 15px; height: 300px; overflow-y: auto; border-radius: 4px; font-size: 13px; white-space: pre-wrap; }
        .log-entry { margin: 5px 0; padding: 5px; border-bottom: 1px solid #333; }
        .log-entry.sent { color: #4ec9b0; }
        .log-entry.received { color: #ce9178; }
        .log-entry.error { color: #f44747; }
        .log-entry.info { color: #9cdcfe; }
        .status { display: inline-block; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .status.connected { background: #28a745; color: white; }
        .status.disconnected { background: #dc3545; color: white; }
        .status.connecting { background: #ffc107; color: black; }
        .two-clients { display: flex; gap: 20px; }
        .client { flex: 1; }
    </style>
</head>
<body>
    <h1>AimMaster WebSocket Test Client</h1>
    <p>Open this page in two browser tabs to simulate two players in the same room.</p>

    <div class="panel">
        <h3>1. Authentication</h3>
        <label>Username:</label>
        <input type="text" id="username" value="demo1" placeholder="e.g. demo1">
        <label>Password:</label>
        <input type="password" id="password" value="demo123@23" placeholder="Password">
        <button onclick="authenticate()">Authenticate</button>
        <span id="authStatus" class="status disconnected">Not authenticated</span>
    </div>

    <div class="panel">
        <h3>2. Room</h3>
        <label>Room Code:</label>
        <input type="text" id="roomCode" value="DEMO1" placeholder="e.g. DEMO1">
        <label>Room ID (numeric, from room creation):</label>
        <input type="number" id="roomId" value="3" placeholder="e.g. 3">
        <button onclick="connectWebSocket()" id="connectBtn" disabled>Connect WebSocket</button>
        <button onclick="disconnectWebSocket()" id="disconnectBtn" disabled>Disconnect</button>
        <span id="wsStatus" class="status disconnected">Disconnected</span>
    </div>

    <div class="panel">
        <h3>3. Test Message (Sent to /app/room/{roomId}/test)</h3>
        <label>Message:</label>
        <input type="text" id="testMessage" value="Hello from browser!" placeholder="Test message">
        <button onclick="sendTestMessage()" id="sendTestBtn" disabled>Send Test Message</button>
    </div>

    <div class="panel">
        <h3>4. Fire Event (Sent to /app/room/{roomId}/fire)</h3>
        <label>Target ID:</label>
        <input type="number" id="targetId" value="1" placeholder="e.g. 1">
        <button onclick="sendFire()" id="sendFireBtn" disabled">Fire!</button>
    </div>

    <div class="panel">
        <h3>5. Broadcast Log</h3>
        <div id="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let stompClient = null;
        let jwtToken = null;
        let currentRoomId = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function setStatus(elementId, text, className) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `status ${className}`;
        }

        function setButtonsEnabled(ids, enabled) {
            ids.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = !enabled;
            });
        }

        async function authenticate() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) throw new Error(await res.text());

                const data = await res.json();
                jwtToken = data.token;
                log(`Authenticated as ${data.username} (playerId: ${data.playerId})`, 'info');
                setStatus('authStatus', 'Authenticated', 'connected');
                setButtonsEnabled(['connectBtn'], true);
            } catch (err) {
                log(`Authentication failed: ${err.message}`, 'error');
                setStatus('authStatus', 'Failed', 'disconnected');
            }
        }

        function connectWebSocket() {
            if (!jwtToken) {
                log('Please authenticate first', 'error');
                return;
            }

            currentRoomId = document.getElementById('roomId').value;
            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = (str) => log(`STOMP: ${str}`, 'info');

            stompClient.connect(
                { Authorization: `Bearer ${jwtToken}` },
                (frame) => {
                    log(`Connected: ${frame}`, 'info');
                    setStatus('wsStatus', 'Connected', 'connected');
                    setButtonsEnabled(['connectBtn'], false);
                    setButtonsEnabled(['disconnectBtn', 'sendTestBtn', 'sendFireBtn'], true);

                    stompClient.subscribe(`/topic/room/${currentRoomId}`, (message) => {
                        log(`RECEIVED: ${message.body}`, 'received');
                    });

                    log(`Subscribed to /topic/room/${currentRoomId}`, 'info');
                },
                (error) => {
                    log(`Connection error: ${error}`, 'error');
                    setStatus('wsStatus', 'Error', 'disconnected');
                    setButtonsEnabled(['connectBtn'], true);
                    setButtonsEnabled(['disconnectBtn', 'sendTestBtn', 'sendFireBtn'], false);
                }
            );
        }

        function disconnectWebSocket() {
            if (stompClient) {
                stompClient.disconnect(() => {
                    log('Disconnected', 'info');
                    setStatus('wsStatus', 'Disconnected', 'disconnected');
                    setButtonsEnabled(['connectBtn'], true);
                    setButtonsEnabled(['disconnectBtn', 'sendTestBtn', 'sendFireBtn'], false);
                    stompClient = null;
                });
            }
        }

        function sendTestMessage() {
            if (!stompClient || !stompClient.connected) {
                log('Not connected', 'error');
                return;
            }
            const message = document.getElementById('testMessage').value;
            const payload = JSON.stringify({ content: message });
            stompClient.send(`/app/room/${currentRoomId}/test`, {}, payload);
            log(`SENT test: ${payload}`, 'sent');
        }

        function sendFire() {
            if (!stompClient || !stompClient.connected) {
                log('Not connected', 'error');
                return;
            }
            const targetId = parseInt(document.getElementById('targetId').value, 10);
            const payload = JSON.stringify({ targetId });
            stompClient.send(`/app/room/${currentRoomId}/fire`, {}, payload);
            log(`SENT fire: ${payload}`, 'sent');
        }
    </script>
</body>
</html>
