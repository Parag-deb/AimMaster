<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimMaster - Settings</title>
    <style>
        :root, [data-theme="regular"] {
            --bg: #06111f; --panel: #0d1c30; --line: rgba(120,190,255,0.2);
            --text: #f4f8ff; --muted: #91a7bd; --cyan: #38e1ff; --green: #46e2a0;
        }
        [data-theme="dark"] {
            --bg: #020408; --panel: #060a12; --line: rgba(100,160,255,0.15);
            --text: #e6ecff; --muted: #7b86a3; --cyan: #2ec4ff; --green: #38d494;
        }
        [data-theme="light"] {
            --bg: #f0f4fa; --panel: #ffffff; --line: rgba(0,0,0,0.1);
            --text: #1a1f2e; --muted: #5a6478; --cyan: #0090b3; --green: #0d8a5e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: ui-sans-serif, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 24px; width: 100%; max-width: 420px;
        }
        h2 { margin: 0 0 16px; }
        label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
        select, button {
            width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 14px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--line); color: var(--text);
        }
        button { background: var(--cyan); color: #04101d; font-weight: 700; cursor: pointer; border: none; margin-top: 16px; }
        button:hover { filter: brightness(1.1); }
        .btn-row { display: flex; gap: 8px; margin-top: 16px; }
        .error { color: #ff5d73; font-size: 13px; margin-top: 8px; min-height: 16px; }
        .success { color: var(--green); font-size: 13px; margin-top: 8px; }
        a { color: var(--cyan); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Settings</h2>
        <label>Theme</label>
        <select id="theme-select">
            <option value="regular">Regular</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </select>
        <button onclick="saveSettings()">Save Settings</button>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        <div class="btn-row">
            <a href="/GameClient.html"><button class="secondary" type="button" style="background:transparent; border:1px solid var(--line); color:var(--text);">Back to Game</button></a>
        </div>
    </div>

    <script>
        const jwt = localStorage.getItem('aimmaster-jwt');
        if (!jwt) { window.location.href = '/GameClient.html'; }

        async function loadSettings() {
            const res = await fetch('/api/settings', {
                headers: { 'Authorization': 'Bearer ' + jwt }
            });
            if (!res.ok) { window.location.href = '/GameClient.html'; return; }
            const data = await res.json();
            document.getElementById('theme-select').value = data.theme || 'regular';
            applyTheme(data.theme || 'regular');
        }

        async function saveSettings() {
            const theme = document.getElementById('theme-select').value;
            const res = await fetch('/api/settings', {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + jwt,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ theme })
            });
            if (!res.ok) {
                const err = await res.text();
                document.getElementById('error').textContent = err || 'Failed to save';
                return;
            }
            applyTheme(theme);
            document.getElementById('success').textContent = 'Settings saved!';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('aimmaster-theme', theme);
        }

        (function init() {
            const saved = localStorage.getItem('aimmaster-theme');
            if (saved) applyTheme(saved);
            loadSettings();
        })();
    </script>
</body>
</html>
